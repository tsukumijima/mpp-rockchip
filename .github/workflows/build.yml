name: Build and Release Debian Package

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Target commit SHA to build (full SHA recommended).'
        required: true
        type: string

permissions:
  contents: write

jobs:

  build-and-release:
    name: Build and Release Debian Package
    # Run on arm64 hosted runner to avoid QEMU emulation slowness.
    runs-on: ubuntu-22.04-arm
    strategy:
      matrix:
        image:
          - arm64v8/ubuntu
    permissions:
      contents: write
    steps:

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.commit_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # The package is still built inside Ubuntu 20.04 container for glibc compatibility.
      - name: Cache Docker layers
        uses: docker/build-push-action@v3
        with:
          context: .github/workflows/
          tags: ${{ matrix.image }}:build
          platforms: linux/arm64
          build-args: IMAGE=${{ matrix.image }}:20.04
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          load: true

      - name: Build
        run: |
          docker run --rm -i -v $(pwd):/work -w /work ${{ matrix.image }}:build bash -c 'debuild -us -uc -b && cp -a ../*.deb ./'

      - name: Get version
        id: get_version
        run: |
          echo "version=$(docker run --rm -i -v $(pwd):/work -w /work ${{ matrix.image }}:build bash -c 'dpkg-parsechangelog --show-field Version')" >> $GITHUB_OUTPUT

      - name: Get commit metadata
        id: get_commit_hash
        run: |
          echo "date=$(git show -s --format=%cd --date=format:%Y%m%d HEAD)" >> $GITHUB_OUTPUT
          echo "full=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "short=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Compute release tag
        id: release_tag
        run: |
          echo "tag=v${{ steps.get_version.outputs.version }}-${{ steps.get_commit_hash.outputs.date }}-${{ steps.get_commit_hash.outputs.short }}" >> $GITHUB_OUTPUT

      - name: Create and push tag (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          tag='${{ steps.release_tag.outputs.tag }}'
          head_sha="$(git rev-parse HEAD)"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            existing_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk '{print $1}')"

            if [ "${existing_sha}" != "${head_sha}" ]; then
              echo "Remote tag already exists but points to a different commit. tag=${tag} existing_sha=${existing_sha} head_sha=${head_sha}" >&2
              exit 1
            fi

            echo "Remote tag already exists and matches HEAD. tag=${tag}"
            exit 0
          fi

          git tag "${tag}" "${head_sha}"
          git push origin "refs/tags/${tag}"

      - name: Release (push)
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.release_tag.outputs.tag }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            ./*.deb

      - name: Release (workflow_dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ steps.release_tag.outputs.tag }}
          tag_name: ${{ steps.release_tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            ./*.deb
